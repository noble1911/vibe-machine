name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # only used by the release step on version tags

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      # The devkitPro image has no git; without it actions/checkout falls
      # back to a tarball download that cannot fetch submodules (AMY).
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build
        run: make -j"$(nproc)"

      - name: Collect licences
        run: cp third_party/amy/LICENSE LICENSE-AMY.txt

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: vibe-machine-${{ github.sha }}
          path: |
            vibe-machine.3dsx
            vibe-machine.smdh
            LICENSE
            LICENSE-AMY.txt
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            vibe-machine.3dsx
            LICENSE
            LICENSE-AMY.txt
          generate_release_notes: true
